name: Test basic usage - latest with legacy alias
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up mock curl
        run: |
          # Create a fake docker-compose binary payload
          printf '#!/bin/sh\necho "Docker Compose version v2.99.0"\n' > /tmp/fake-docker-compose
          chmod +x /tmp/fake-docker-compose

          # Copy the committed mock curl fixture into place
          mkdir -p /tmp/mock-bin
          cp "$GITHUB_WORKSPACE/tests/fixtures/mock-curl" /tmp/mock-bin/curl
          chmod +x /tmp/mock-bin/curl
          echo "/tmp/mock-bin" >> "$GITHUB_PATH"

      - name: Install Docker Compose (latest, with legacy alias)
        id: action
        uses: .
        with:
          version: latest
          legacy: true

      - name: Assert docker compose plugin is installed
        run: |
          echo "Checking docker compose plugin..."
          if [ ! -f "$HOME/.docker/cli-plugins/docker-compose" ]; then
            echo "FAIL: docker-compose plugin not found at ~/.docker/cli-plugins/docker-compose"
            exit 1
          fi
          echo "PASS: docker-compose plugin found"

      - name: Assert docker compose plugin is executable
        run: |
          if [ ! -x "$HOME/.docker/cli-plugins/docker-compose" ]; then
            echo "FAIL: docker-compose plugin is not executable"
            exit 1
          fi
          echo "PASS: docker-compose plugin is executable"

      - name: Assert legacy docker-compose symlink exists
        run: |
          if [ ! -L "$HOME/.local/bin/docker-compose" ]; then
            echo "FAIL: legacy docker-compose symlink not found at ~/.local/bin/docker-compose"
            exit 1
          fi
          echo "PASS: legacy docker-compose symlink found"

      - name: Assert docker compose binary runs and reports version
        run: |
          VERSION_OUTPUT=$("$HOME/.docker/cli-plugins/docker-compose" version 2>&1 || true)
          echo "docker-compose version output: $VERSION_OUTPUT"
          if echo "$VERSION_OUTPUT" | grep -qi "compose"; then
            echo "PASS: docker-compose runs and reports version"
          else
            echo "FAIL: docker-compose did not report a version"
            exit 1
          fi
